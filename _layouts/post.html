---
layout: default
---

<article class="container-post">
  <div class="post-title">
    <h1>{{ page.title }}</h1>
  </div>
  {% if site.name %}
  <div class="post-author print-post-author">
    <span>{{ site.name }}</span>
  </div>
  {% endif %}
  <div class="post-content">
    {{ content }}
  </div>
  <div class="post-date">
    {{ page.date | date: '%Y-%m-%d' }}
  </div>
  {% if site.comments %}
    {% include comments.html %}
  {% endif %}
</article>
